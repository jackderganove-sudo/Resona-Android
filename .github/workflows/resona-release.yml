name: Resona release

# Every push to main builds signed APKs (arm64 + universal) and publishes
# them as a GitHub release v1.0.<n> with notes from the commits since the
# previous release. The keystore only exists during the build (secret).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: resona-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          # Upstream ArchiveTune tags (v12…, v14…) live in the fork too: only v1.x.y counts.
          last=$(git tag -l --sort=-v:refname | grep -E '^v1\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then next="1.0.0"; else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "name=$next" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "Resona Android $next"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          test -s app/keystore/release.keystore

      - name: Build signed APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RESONA_VERSION_NAME: ${{ steps.version.outputs.name }}
          RESONA_VERSION_CODE: ${{ steps.version.outputs.code }}
          GITHUB_OWNER: jackderganove-sudo
          GITHUB_REPO: Resona-Android
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGmsMobileArm64Release assembleGmsMobileUniversalRelease > build.log 2>&1 || {
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -80
            tail -40 build.log
            exit 1
          }
          grep -E "BUILD SUCCESSFUL" build.log

      - name: Collect APKs
        run: |
          mkdir -p out
          for abi in arm64 universal; do
            apk=$(find app/build/outputs/apk -path "*gmsMobile*${abi^}*release*" -name "*.apk" | head -1)
            [ -z "$apk" ] && apk=$(find app/build/outputs/apk -iname "*${abi}*release*.apk" | head -1)
            test -n "$apk"
            # Names the in-app updater looks for.
            cp "$apk" "out/app-gms-mobile-${abi}-release.apk"
          done
          ls -la out

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          last="${{ steps.version.outputs.last }}"
          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD~30..HEAD"; fi
          git log "$range" --no-merges --pretty='- %s' | head -60 > notes.md || true
          [ -s notes.md ] || echo "- Bug fixes and improvements" > notes.md
          gh release create "$tag" out/*.apk --target "$GITHUB_SHA" --title "Resona Android $tag" --notes-file notes.md

      - name: Build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
