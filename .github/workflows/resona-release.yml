name: Resona release

# Every push to main: build signed APKs (arm64 + universal), run the update
# policy unit tests, start a freshly installed APK on an emulator and check
# that it is not locked (no "Update required" screen), then publish a GitHub
# release v1.0.<n> with notes from the commits since the previous release.
# The keystore only exists during the build (secret).
on:
  push:
    branches: [main, wip]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: resona-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_OWNER: jackderganove-sudo
  GITHUB_REPO: Resona-Android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      name: ${{ steps.version.outputs.name }}
      last: ${{ steps.version.outputs.last }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          # Upstream ArchiveTune tags (v12…, v14…) live in the fork too: only v1.x.y counts.
          last=$(git tag -l --sort=-v:refname | grep -E '^v1\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then next="1.0.0"; else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "name=$next" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "Resona Android $next"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          test -s app/keystore/release.keystore

      - name: Build signed APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RESONA_VERSION_NAME: ${{ steps.version.outputs.name }}
          RESONA_VERSION_CODE: ${{ steps.version.outputs.code }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGmsMobileArm64Release assembleGmsMobileUniversalRelease > build.log 2>&1 || {
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -80
            tail -40 build.log
            exit 1
          }
          grep -E "BUILD SUCCESSFUL" build.log

      - name: Update policy unit tests
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RESONA_VERSION_NAME: ${{ steps.version.outputs.name }}
          RESONA_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew --no-daemon testGmsMobileArm64DebugUnitTest --tests 'moe.rukamori.archivetune.updates.*' --tests 'moe.rukamori.archivetune.resona.*' --tests 'moe.rukamori.archivetune.resona.aisync.*' > test.log 2>&1 || {
            grep -E "^e: |FAILED|What went wrong|AssertionError" -A4 test.log | head -80
            exit 1
          }
          grep -E "BUILD SUCCESSFUL" test.log

      - name: Onboarding test APKs
        env:
          RESONA_VERSION_NAME: ${{ steps.version.outputs.name }}
          RESONA_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew --no-daemon assembleGmsMobileX86_64Debug assembleGmsMobileX86_64DebugAndroidTest > instrumented.log 2>&1 || {
            grep -E "^e: |error:|What went wrong" -A3 instrumented.log | head -80
            tail -40 instrumented.log
            exit 1
          }
          mkdir -p instrumented
          cp "$(find app/build/outputs/apk -path '*gmsMobileX86_64/debug/*' -name '*.apk' | head -1)" instrumented/app-debug.apk
          cp "$(find app/build/outputs/apk/androidTest -name '*.apk' | head -1)" instrumented/app-debug-androidTest.apk
          ls -la instrumented

      - uses: actions/upload-artifact@v4
        with:
          name: instrumented
          path: instrumented/*.apk
          retention-days: 3

      - name: Collect APKs
        run: |
          mkdir -p out
          for abi in arm64 universal; do
            apk=$(find app/build/outputs/apk -path "*gmsMobile*${abi^}*release*" -name "*.apk" | head -1)
            [ -z "$apk" ] && apk=$(find app/build/outputs/apk -iname "*${abi}*release*.apk" | head -1)
            test -n "$apk"
            # Names the in-app updater looks for.
            cp "$apk" "out/app-gms-mobile-${abi}-release.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
          retention-days: 7

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore

  # A freshly installed APK must start into the app (onboarding / home),
  # never into ArchiveTune's blocking "Update required" screen.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: instrumented
          path: instrumented

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash .github/scripts/resona-smoke.sh
            bash .github/scripts/resona-onboarding-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-start
          path: |
            start.png
            ui.xml
            activity.txt
            instrument.txt
            onboarding-end.png
            onboarding-logcat.txt
          if-no-files-found: ignore

  release:
    # wip: build, tests and start check only (APKs as artifact for the Pixel).
    if: github.ref == 'refs/heads/main'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.build.outputs.name }}"
          last="${{ needs.build.outputs.last }}"
          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD~30..HEAD"; fi
          git log "$range" --no-merges --pretty='- %s' | grep -v -i 'skip ci' | head -60 > notes.md || true
          [ -s notes.md ] || echo "- Bug fixes and improvements" > notes.md
          gh release create "$tag" out/*.apk --target "$GITHUB_SHA" --title "Resona Android $tag" --notes-file notes.md
